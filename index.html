(()=>{
'use strict';
const $=id=>document.getElementById(id),SAVE='monopolyfunny-v1',COLORS=['#55c6ff','#ff8b79','#ffd16a','#9df6a7'],TOKENS=['🔷','🔴','🟡','🟢'],groups=['#7d4b2a','#a8dfff','#f094c6','#ffb34e','#e4444d','#e8d15b','#43ba78','#344caa'];

const groupIndices=[[1,3],[6,8,9],[11,13,14],[16,18,19],[21,23,24],[26,27,29],[31,32,34],[37,39]];
const prices=[0,60,0,60,0,200,100,0,100,120,0,140,150,140,160,200,180,0,180,200,0,220,0,220,240,200,260,260,150,280,0,300,300,0,320,200,0,350,0,400];
const props=names.map((name,i)=>({name,price:prices[i],group:groupIndices.findIndex(g=>g.includes(i)),owner:-1,houses:0,mortgaged:false}));
let state=null,busy=false,decision=false,modalResolver=null;
function initial(ai=2,difficulty='normal'){props.forEach(p=>{p.owner=-1;p.houses=0;p.mortgaged=false});return {players:Array.from({length:ai+1},(_,i)=>({name:i?'AI '+i:'Εσύ',money:1500,pos:0,jail:0,dead:false,color:COLORS[i],token:TOKENS[i]})),current:0,phase:'roll',round:1,log:[],dice:[1,1],doubles:0,ai,difficulty,properties:props.map(p=>({owner:p.owner,houses:0,mortgaged:false})),winner:null}} 
function sync(){if(!state)return;state.properties.forEach((p,i)=>Object.assign(props[i],p))}
function save(){try{localStorage.setItem(SAVE,JSON.stringify(state))}catch(_){}}
function note(t){state.log.unshift(t);state.log=state.log.slice(0,45);$('status').textContent=t;save()}
function player(){return state.players[state.current]}
function own(i){return props[i].owner}
function ownedBy(i){return props.filter(p=>p.owner===i)}
function monopoly(p){return p.group>=0&&groupIndices[p.group].every(i=>own(i)===p.owner&&!props[i].mortgaged)}
function rent(i,dice=7){let p=props[i];if(p.mortgaged||p.owner<0)return 0;if([5,15,25,35].includes(i))return 25*Math.pow(2,Math.max(0,[5,15,25,35].filter(x=>own(x)===p.owner).length-1));if([12,28].includes(i))return dice*([12,28].filter(x=>own(x)===p.owner).length===2?10:4);let base=Math.max(2,Math.round(p.price/12));return p.houses?Math.round(base*[1,5,15,40,65,90][p.houses]):base*(monopoly(p)?2:1)}
function worth(i){return state.players[i].money+ownedBy(i).reduce((a,p)=>a+p.price/2+p.houses*p.price/4,0)}
function pay(from,to,amount){let p=state.players[from];p.money-=amount;if(to>=0&&!state.players[to].dead)state.players[to].money+=amount;if(p.money<0){autoLiquidate(from);if(p.money<0){bankrupt(from,to)}}}
function autoLiquidate(i){let p=state.players[i];for(const prop of ownedBy(i).sort((a,b)=>b.houses-a.houses)){while(p.money<0&&prop.houses>0){prop.houses--;p.money+=Math.floor(prop.price/4);note(p.name+' πούλησε κτίριο: '+prop.name)}if(p.money>=0)break}for(const prop of ownedBy(i)){if(p.money>=0)break;if(!prop.mortgaged){prop.mortgaged=true;p.money+=Math.floor(prop.price/2);note(p.name+' υποθήκευσε '+prop.name)}}}
function bankrupt(i,to){const p=state.players[i];p.dead=true;p.money=0;props.forEach(prop=>{if(prop.owner===i){prop.owner=to>=0?to:-1;prop.houses=0;prop.mortgaged=to>=0?prop.mortgaged:false}});note('💥 Χρεοκόπησε: '+p.name);const alive=state.players.filter(x=>!x.dead);if(alive.length===1){state.winner=state.players.indexOf(alive[0]);state.phase='finished';note('🏆 Νικητής: '+alive[0].name)}}
function position(i){if(i<=10)return {row:11,col:11-i};if(i<=20)return {row:11-(i-10),col:1};if(i<=30)return {row:1,col:i-19};return {row:i-29,col:11}}
function board(){const b=$('board');b.replaceChildren();for(let i=0;i<40;i++){const p=props[i],el=document.createElement('button'),xy=position(i);el.className='tile'+(p.owner>=0?' owned':'');el.style.gridRow=xy.row;el.style.gridColumn=xy.col;if(p.owner>=0)el.style.setProperty('--owner',COLORS[p.owner]);let band=document.createElement('div');band.className='band';band.style.background=p.group>=0?groups[p.group]:p.price?'#65a7bd':'#2d5876';let label=document.createElement('span');label.className='name';label.textContent=p.name;let cost=document.createElement('span');cost.className='price';cost.textContent=p.price?p.price+'€':i===0?'+200€':'';let houses=document.createElement('span');houses.className='houses';houses.textContent=p.mortgaged?'Υ':p.houses===5?'🏨':p.houses?'⌂'.repeat(p.houses):'';let tokens=document.createElement('span');tokens.className='tokens';tokens.textContent=state.players.filter(x=>!x.dead&&x.pos===i).map(x=>x.token).join('');el.append(band,label,cost,houses,tokens);el.onclick=()=>info(i);b.append(el)}let center=document.createElement('div');center.className='center';center.innerHTML='<h2>MonopolyFunny</h2><div class="dice" id="dice">🎲 🎲</div><small>Ακίνητα • Στρατηγική • AI</small>';b.append(center);$('dice').textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][state.dice[0]-1]+' '+['⚀','⚁','⚂','⚃','⚄','⚅'][state.dice[1]-1]}
function render(){sync();board();$('players').replaceChildren();state.players.forEach((p,i)=>{let el=document.createElement('div');el.className='player'+(state.current===i?' active':'')+(p.dead?' dead':'');el.style.setProperty('--pc',p.color);el.innerHTML='<strong>'+p.token+' '+p.name+(p.jail?' 🔒':'')+'</strong>'+p.money+'€ · '+ownedBy(i).length+' ακίνητα';$('players').append(el)});$('turn').textContent=state.winner!==null?'🏆 Νικητής: '+state.players[state.winner].name:'Σειρά: '+player().name+' · Γύρος '+state.round;const human=state.current===0&&!player().dead&&!busy&&state.winner===null;$('roll').disabled=!human||state.phase!=='roll';$('roll').hidden=state.phase!=='roll';$('buy').hidden=!(human&&state.phase==='buy');$('auction').hidden=!(human&&state.phase==='buy');$('end').hidden=!(human&&state.phase==='end');$('build').disabled=!human||!['roll','end'].includes(state.phase);$('mortgage').disabled=!human||!['roll','end'].includes(state.phase);$('log').replaceChildren();state.log.slice(0,12).forEach(x=>{let p=document.createElement('p');p.textContent=x;$('log').append(p)});save()}
function modal(title,body,actions){return new Promise(resolve=>{modalResolver=resolve;$('modalTitle').textContent=title;$('modalBody').replaceChildren();let p=document.createElement('p');p.textContent=body;$('modalBody').append(p);$('dialogActions').replaceChildren();actions.forEach(([label,value])=>{let btn=document.createElement('button');btn.textContent=label;btn.onclick=()=>{$('modal').close();modalResolver=null;resolve(value)};$('dialogActions').append(btn)});$('modal').showModal()})}
$('modal').addEventListener('cancel',e=>{if(modalResolver){e.preventDefault();$('dialogActions').querySelector('button:last-child')?.click()}});
function info(i){const p=props[i];modal(p.name,'Τιμή: '+p.price+'€ · Ιδιοκτήτης: '+(p.owner<0?'Τράπεζα':state.players[p.owner].name)+' · Ενοίκιο: '+rent(i)+'€ · Κτίρια: '+p.houses+(p.mortgaged?' · Υποθήκη':''),[['Κλείσιμο',true]])}
function card(i){const community=[['Κέρδισες βραβείο!',100],['Έξοδα επισκευής',-80],['Επιστροφή φόρου',60],['Δωρεά στην κοινότητα',-40]];const chance=[['Τυχερή επένδυση!',150],['Πρόστιμο στάθμευσης',-50],['Κέρδη από πωλήσεις',90],['Έκτακτη χρέωση',-100]];let pool=i===7||i===22||i===36?chance:community;let [t,m]=pool[Math.floor(Math.random()*pool.length)];if(m>=0)player().money+=m;else pay(state.current,-1,-m);note('🃏 '+t+' '+(m>=0?'+':'')+m+'€')}
function land(dice){const p=player(),i=p.pos,prop=props[i];if(i===30){p.pos=10;p.jail=3;state.doubles=0;note(p.name+' πήγε φυλακή');return}if([2,7,17,22,33,36].includes(i)){card(i);return}if(i===4||i===38){pay(state.current,-1,i===4?200:100);note(p.name+' πλήρωσε φόρο');return}if(!prop.price)return;if(prop.owner===-1){if(state.current===0){state.phase='buy';note('Διαθέσιμο: '+prop.name+' ('+prop.price+'€)')}else{if(p.money>=prop.price+(state.difficulty==='hard'?120:200)&&Math.random()<(state.difficulty==='easy'?.65:.93)){buy(i)}else auction(i)}return}if(prop.owner!==state.current&&!prop.mortgaged){const amount=rent(i,dice);pay(state.current,prop.owner,amount);note(p.name+' πλήρωσε '+amount+'€ στον '+state.players[prop.owner].name)}}
function buy(i){const p=props[i],buyer=player();if(p.owner!==-1||buyer.money<p.price)return false;buyer.money-=p.price;p.owner=state.current;note(buyer.name+' αγόρασε '+p.name+' για '+p.price+'€');return true}
function auction(i){const prop=props[i],candidates=state.players.map((p,j)=>({p,j,bid:Math.min(Math.floor(p.money*.75),Math.round(prop.price*(.65+Math.random()*.5)))})).filter(x=>!x.p.dead&&x.p.money>=x.bid&&x.bid>=Math.round(prop.price*.5));candidates.sort((a,b)=>b.bid-a.bid);if(candidates.length){let win=candidates[0];win.p.money-=win.bid;prop.owner=win.j;note('🔨 '+win.p.name+' κέρδισε '+prop.name+' με '+win.bid+'€')}else note('🔨 Το '+prop.name+' έμεινε στην τράπεζα')}
function move(steps){const p=player(),old=p.pos;p.pos=(old+steps)%40;if(p.pos<old){p.money+=200;note(p.name+' πέρασε από Αφετηρία: +200€')}}
function roll(){if(state.phase!=='roll'||state.winner!==null)return;const p=player(),a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);state.dice=[a,b];const doubles=a===b;note(p.name+' έφερε '+a+' + '+b);if(p.jail){if(doubles){p.jail=0;note(p.name+' βγήκε από τη φυλακή')}else{p.jail--;if(!p.jail){pay(state.current,-1,50);note(p.name+' πλήρωσε 50€ για έξοδο')}else{state.phase='end';render();return}}}else{state.doubles=doubles?state.doubles+1:0;if(state.doubles===3){p.pos=10;p.jail=3;state.doubles=0;state.phase='end';note('Τρεις διπλές ζαριές: φυλακή');render();return}}move(a+b);land(a+b);if(state.phase!=='buy')state.phase='end';if(doubles&&!p.jail&&!p.dead&&state.phase==='end'){state.phase='roll';note('Διπλή ζαριά: ξαναπαίζεις')}render()}
function next(){if(state.winner!==null||state.phase!=='end'||state.current!==0)return;state.phase='roll';state.doubles=0;let old=state.current;do{state.current=(state.current+1)%state.players.length}while(state.players[state.current].dead);if(state.current<=old)state.round++;render();if(state.current!==0)aiTurn()}
async function aiTurn(){if(busy||state.winner!==null)return;busy=true;render();await new Promise(r=>setTimeout(r,500));let guard=0;while(state.current!==0&&state.winner===null&&guard++<30){if(state.phase==='roll')roll();if(state.phase==='buy'){auction(player().pos);state.phase='end'}if(state.phase==='end'){const i=state.current;aiBuild(i);nextAi();}render();await new Promise(r=>setTimeout(r,450))}busy=false;render()}
function nextAi(){const old=state.current;state.phase='roll';state.doubles=0;do{state.current=(state.current+1)%state.players.length}while(state.players[state.current].dead);if(state.current<=old)state.round++}
function aiBuild(i){const p=state.players[i];if(p.money<350)return;let opts=props.filter(x=>x.owner===i&&monopoly(x)&&x.houses<5&&!x.mortgaged);if(opts.length){const x=opts.sort((a,b)=>a.houses-b.houses)[0],cost=Math.round(x.price/2);if(p.money>cost+250&&x.houses===Math.min(...groupIndices[x.group].map(k=>props[k].houses))){p.money-=cost;x.houses++;note(p.name+' έχτισε στο '+x.name)}}}
$('roll').onclick=roll;$('buy').onclick=()=>{if(buy(player().pos))state.phase='end';else note('Δεν υπάρχουν αρκετά χρήματα');render()};$('auction').onclick=()=>{auction(player().pos);state.phase='end';render()};$('end').onclick=next;
$('build').onclick=async()=>{let options=props.map((p,i)=>({p,i})).filter(x=>x.p.owner===0&&monopoly(x.p)&&x.p.houses<5&&!x.p.mortgaged&&player().money>=Math.round(x.p.price/2));if(!options.length){await modal('Χτίσιμο','Χρειάζεσαι πλήρη ομάδα χρώματος και αρκετά χρήματα.',[['Εντάξει',0]]);return}let choice=await modal('Χτίσιμο','Διάλεξε ακίνητο. Κόστος κάθε κτιρίου: μισή τιμή αγοράς.',[...options.map(x=>[x.p.name+' ('+Math.round(x.p.price/2)+'€)',x.i]),['Άκυρο',-1]]);if(choice>=0){let p=props[choice];const siblings=groupIndices[p.group].map(i=>props[i].houses);if(p.houses>Math.min(...siblings)){note('Χτίζεις ομοιόμορφα σε όλη την ομάδα');render();return}player().money-=Math.round(p.price/2);p.houses++;note('Έχτισες στο '+p.name);render()}};
$('mortgage').onclick=async()=>{const opts=props.map((p,i)=>({p,i})).filter(x=>x.p.owner===0&&(x.p.mortgaged?player().money>=Math.ceil(x.p.price*.55):x.p.houses===0&&groupIndices[x.p.group]?.every(i=>props[i].houses===0)!==false));if(!opts.length){await modal('Υποθήκες','Δεν υπάρχουν διαθέσιμες ενέργειες.',[['Κλείσιμο',-1]]);return}let c=await modal('Υποθήκες','Επιλογή ακινήτου για υποθήκη ή εξόφληση (+10% τόκος).',[...opts.map(x=>[(x.p.mortgaged?'Εξόφληση ':'Υποθήκη ')+x.p.name,x.i]),['Άκυρο',-1]]);if(c>=0){let p=props[c];if(p.mortgaged){player().money-=Math.ceil(p.price*.55);p.mortgaged=false}else{player().money+=Math.floor(p.price/2);p.mortgaged=true}note('Ενημερώθηκε η υποθήκη: '+p.name);render()}};
$('settings').onclick=async()=>{let c=await modal('⚙ Ρυθμίσεις','Παιχνίδι ακινήτων με πρωτότυπο ταμπλό. Στόχος: να μείνεις ο τελευταίος παίκτης με χρήματα. Ρίχνεις δύο ζάρια, αγοράζεις ελεύθερα ακίνητα, εισπράττεις ενοίκια και χτίζεις αφού αποκτήσεις όλα τα ακίνητα ενός χρώματος. Αν αρνηθείς αγορά γίνεται δημοπρασία. Στην Αφετηρία εισπράττεις 200€. Υπάρχουν φόροι, κάρτες, φυλακή, υποθήκες και χρεοκοπία. Η πρόοδος αποθηκεύεται αυτόματα.',[['Συνέχεια',0],['Νέο παιχνίδι',1]]);if(c===1){let n=await modal('Νέο παιχνίδι','Πόσους αντιπάλους AI θέλεις;', [['1 AI',1],['2 AI',2],['3 AI',3],['Άκυρο',0]]);if(n){let ok=await modal('Επιβεβαίωση','Η τρέχουσα παρτίδα θα αντικατασταθεί.',[['Νέα παρτίδα',true],['Άκυρο',false]]);if(ok){state=initial(n);note('Νέα παρτίδα με '+n+' AI');render()}}}};
try{let saved=JSON.parse(localStorage.getItem(SAVE)||'null');state=saved&&Array.isArray(saved.players)&&saved.properties?.length===40? saved:initial(2)}catch(_){state=initial(2)}sync();if(!state.log.length)note('Καλώς ήρθες! Ρίξε τα ζάρια.');render();if(state.current!==0&&state.winner===null)aiTurn();
})();
</script><script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
