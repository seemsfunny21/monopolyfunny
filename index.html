<header><h1>Monopoly<span>Funny</span></h1><div class="header-actions"><button id="newGame" class="primary" type="button">▶ Νέα παρτίδα</button><button id="settings" type="button">⚙ Ρυθμίσεις</button></div></header><main class="layout"><div id="board" class="board" aria-label="Ταμπλό 40 θέσεων"></div><aside><section class="panel"><h3>Παίκτες</h3><div class="players" id="players"></div></section><section class="panel"><h3 id="turn">Η σειρά σου</h3><div class="controls"><button id="buy" hidden style="display:none!important">🏠 Αγορά</button><button id="auction" hidden style="display:none!important">🔨 Δημοπρασία</button><button id="build">🏘️ Χτίσιμο</button><button id="mortgage">🏦 Υποθήκη / Εξόφληση</button><button id="end" hidden>Επόμενος παίκτης ➜</button></div><p id="status" class="hint" role="status"></p></section><section class="panel history-panel" style="display:flex;flex-direction:column"><h3>📜 Ιστορικό</h3><div id="log" class="log" aria-live="polite"></div></section><div id="auctionResult" class="auction-result" hidden aria-live="polite"></div></aside></main><dialog id="purchasePanel" class="panel purchase-panel" aria-labelledby="purchaseTitle" aria-describedby="purchaseDetails"><h3 id="purchaseTitle">🏠 Αγορά ακινήτου</h3><p id="purchaseDetails"></p><div class="purchase-actions"><button id="inlineBuy" class="primary" type="button">🏠 Αγορά</button><button id="inlineAuction" type="button">🔨 Δημοπρασία</button></div><p class="purchase-hint">Επίλεξε αγορά ή δημοπρασία για να συνεχιστεί η παρτίδα.</p></dialog><button id="roll" hidden style="display:none!important" aria-hidden="true" tabindex="-1"></button><dialog id="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div id="dialogActions"></div></dialog><script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),SAVE='monopolyfunny-v1',COLORS=['#55c6ff','#ff8b79','#ffd16a','#9df6a7'],TOKENS=['◆','●','▲','■'],groups=['#7d4b2a','#a8dfff','#f094c6','#ffb34e','#e4444d','#e8d15b','#43ba78','#344caa'];
const names=['Αφετηρία','Οδός Καστανιάς','Ταμείο Κοινότητας','Οδός Πεύκων','Δημοτικός Φόρος','Σταθμός Βορρά','Οδός Λίμνης','Τυχερή Κάρτα','Οδός Πλατάνων','Οδός Κήπων','Επίσκεψη / Φυλακή','Οδός Άνοιξης','Ηλεκτρική Εταιρεία','Οδός Ακτής','Οδός Ηλίου','Σταθμός Ανατολής','Λεωφόρος Φιλίας','Ταμείο Κοινότητας','Λεωφόρος Μουσών','Λεωφόρος Τεχνών','Δωρεάν Στάθμευση','Οδός Ελιάς','Τυχερή Κάρτα','Οδός Αγοράς','Οδός Πλατείας','Σταθμός Νότου','Λεωφόρος Αστεριών','Λεωφόρος Ονείρων','Ύδρευση','Λεωφόρος Θάλασσας','Πήγαινε Φυλακή','Λεωφόρος Βουνού','Λεωφόρος Κάστρου','Ταμείο Κοινότητας','Λεωφόρος Κορυφής','Σταθμός Δύσης','Τυχερή Κάρτα','Λεωφόρος Ορίζοντα','Φόρος Πολυτελείας','Λεωφόρος Φωτός'];
const groupIndices=[[1,3],[6,8,9],[11,13,14],[16,18,19],[21,23,24],[26,27,29],[31,32,34],[37,39]];
const prices=[0,60,0,60,0,200,100,0,100,120,0,140,150,140,160,200,180,0,180,200,0,220,0,220,240,200,260,260,150,280,0,300,300,0,320,200,0,350,0,400];
const props=names.map((name,i)=>({name,price:prices[i],group:groupIndices.findIndex(g=>g.includes(i)),owner:-1,houses:0,mortgaged:false}));
let gameGeneration=0;let state=null,busy=false,decision=false,modalResolver=null,autoRollPending=false,purchasePromptPending=false,turnAdvanceTimer=null,debtPromptPending=false;
function initial(ai=2,difficulty='normal'){props.forEach(p=>{p.owner=-1;p.houses=0;p.mortgaged=false});return {players:Array.from({length:ai+1},(_,i)=>({name:i?'AI '+i:'seemsfunny',money:1500,pos:0,jail:0,dead:false,color:COLORS[i],token:TOKENS[i]})),current:0,phase:'roll',round:1,log:[],dice:[1,1],doubles:0,ai,difficulty,properties:props.map(p=>({owner:p.owner,houses:0,mortgaged:false})),winner:null}} 
function sync(){if(!state)return;state.properties.forEach((p,i)=>Object.assign(props[i],p))}
function save(){if(!state)return;state.properties=props.map(p=>({owner:p.owner,houses:p.houses,mortgaged:p.mortgaged}));try{localStorage.setItem(SAVE,JSON.stringify(state))}catch(_){}}
function historyLabel(t){return String(t).replace(/Ο χρήστης|στον χρήστη|του χρήστη|Εσύ|Εξόφλησες|Υποθήκευσες|Έχτισες/g,m=>({'Ο χρήστης':'seemsfunny','στον χρήστη':'στον seemsfunny','του χρήστη':'του seemsfunny','Εσύ':'seemsfunny','Εξόφλησες':'seemsfunny εξόφλησε','Υποθήκευσες':'seemsfunny υποθήκευσε','Έχτισες':'seemsfunny έχτισε'})[m])}function note(t){t=historyLabel(t);state.log.unshift(t);state.log=state.log.slice(0,45);$('status').textContent=t;save()}
function player(){return state.players[state.current]}
function own(i){return props[i].owner}
function ownedBy(i){return props.filter(p=>p.owner===i)}
function monopoly(p){return p.group>=0&&groupIndices[p.group].every(i=>own(i)===p.owner&&!props[i].mortgaged)}
function rent(i,dice=7){let p=props[i];if(p.mortgaged||p.owner<0)return 0;if([5,15,25,35].includes(i))return 25*Math.pow(2,Math.max(0,[5,15,25,35].filter(x=>own(x)===p.owner).length-1));if([12,28].includes(i))return dice*([12,28].filter(x=>own(x)===p.owner).length===2?10:4);let base=Math.max(2,Math.round(p.price/12));return p.houses?Math.round(base*[1,5,15,40,65,90][p.houses]):base*(monopoly(p)?2:1)}
function worth(i){return state.players[i].money+ownedBy(i).reduce((a,p)=>a+(p.mortgaged?p.price/2:p.price)+p.houses*p.price/2,0)}
const MAX_ROUNDS=50;
function checkEndgame(){if(state.winner!==null||state.round<=MAX_ROUNDS)return false;const scores=state.players.map((p,i)=>({i,score:p.dead?-Infinity:worth(i)})).sort((a,b)=>b.score-a.score);state.winner=scores[0].i;state.phase='finished';note('🏆 Τελική κατάταξη μετά από '+MAX_ROUNDS+' γύρους: '+scores.filter(x=>Number.isFinite(x.score)).map((x,k)=>(k+1)+'. '+state.players[x.i].name+' '+Math.round(x.score)+'€').join(' · '));render();return true}
function pay(from,to,amount){if(amount<=0||state.players[from].dead)return;let p=state.players[from];p.money-=amount;if(p.money<0){if(from===0){state.pendingDebt={to,amount};note('Χρειάζεσαι '+(-p.money)+'€ ακόμη. Επίλεξε ακίνητα για υποθήκη.');return}else{autoLiquidate(from);if(p.money<0){const unpaid=-p.money;p.money=0;bankrupt(from,to);note(p.name+' δεν μπόρεσε να καλύψει '+unpaid+'€ της οφειλής.');amount-=unpaid}}}if(to>=0&&!state.players[to].dead)state.players[to].money+=Math.max(0,amount)}
function autoLiquidate(i){let p=state.players[i];for(const prop of ownedBy(i).sort((a,b)=>b.houses-a.houses)){while(p.money<0&&prop.houses>0){prop.houses--;p.money+=Math.floor(prop.price/4);note(p.name+' πούλησε κτίριο: '+prop.name)}if(p.money>=0)break}for(const prop of ownedBy(i)){if(p.money>=0)break;if(!prop.mortgaged&&prop.houses===0&&(prop.group<0||groupIndices[prop.group].every(k=>props[k].houses===0))){prop.mortgaged=true;p.money+=Math.floor(prop.price/2);note(p.name+' υποθήκευσε '+prop.name)}}}
function bankrupt(i,to){const p=state.players[i];if(p.dead)return;p.dead=true;p.money=0;props.forEach(prop=>{if(prop.owner===i){prop.owner=to>=0?to:-1;prop.houses=0;prop.mortgaged=to>=0?prop.mortgaged:false}});note('💥 Χρεοκόπησε: '+p.name);const alive=state.players.filter(x=>!x.dead);if(alive.length===1||i===0){const winner=alive.map(x=>state.players.indexOf(x)).sort((a,b)=>worth(b)-worth(a))[0];state.winner=winner;state.phase='finished';note('🏆 Νικητής: '+state.players[winner].name+(i===0?' · Ο seemsfunny χρεοκόπησε.':''))}}
function position(i){if(i<=10)return {row:11,col:11-i};if(i<=20)return {row:11-(i-10),col:1};if(i<=30)return {row:1,col:i-19};return {row:i-29,col:11}}
function board(){const b=$('board'),side=document.querySelector('aside');b.replaceChildren();for(let i=0;i<40;i++){const p=props[i],el=document.createElement('button'),xy=position(i);el.className='tile'+(p.owner>=0?' owned':'');el.style.gridRow=xy.row;el.style.gridColumn=xy.col;if(p.owner>=0){el.style.setProperty('--owner',COLORS[p.owner]);el.style.setProperty('--owner-ink','#091827');el.style.setProperty('background-color',COLORS[p.owner],'important');el.style.setProperty('background-image','none','important');el.style.setProperty('color','#061827','important');el.dataset.owner=String(p.owner);el.setAttribute('aria-label',p.name+', ιδιοκτησία '+state.players[p.owner].name)}let band=document.createElement('div');band.className='band';band.style.background=p.group>=0?groups[p.group]:p.price?'#65a7bd':'#2d5876';let label=document.createElement('span');label.className='name';label.textContent=p.name;let cost=document.createElement('span');cost.className='price';cost.textContent=p.price?p.price+'€':i===0?'+200€':'';let houses=document.createElement('span');houses.className='houses';houses.textContent=p.mortgaged?'Υ':p.houses===5?'🏨':p.houses?'⌂'.repeat(p.houses):'';let tokens=document.createElement('span');tokens.className='tokens';tokens.replaceChildren();state.players.forEach((x,j)=>{if(x.dead||x.pos!==i)return;let t=document.createElement('b');t.className='piece';t.style.setProperty('--piece',x.color);t.textContent=x.token;t.title=x.name;tokens.append(t)});el.append(band,label,cost,houses,tokens);el.onclick=()=>info(i);b.append(el)}let center=document.createElement('div');center.className='center';center.innerHTML='<h2>MonopolyFunny</h2><div class="dice" id="dice">🎲 🎲</div><small>Ακίνητα • Στρατηγική • AI</small>';b.append(center);if(side)center.append(side);$('dice').textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][state.dice[0]-1]+' '+['⚀','⚁','⚂','⚃','⚄','⚅'][state.dice[1]-1]}
function render(){board();$('players').replaceChildren();state.players.forEach((p,i)=>{let el=document.createElement('div');el.className='player'+(state.current===i?' active':'')+(p.dead?' dead':'');el.style.setProperty('--pc',p.color);el.innerHTML='<strong>'+p.token+' '+p.name+(p.jail?' 🔒':'')+'</strong>'+p.money+'€ · '+ownedBy(i).length+' ακίνητα';$('players').append(el)});$('turn').textContent=state.winner!==null?'🏆 Νικητής: '+state.players[state.winner].name:'Σειρά: '+player().name+' · Γύρος '+Math.min(state.round,MAX_ROUNDS)+'/'+MAX_ROUNDS;const human=state.current===0&&!player().dead&&!busy&&state.winner===null;$('roll').disabled=!human||state.phase!=='roll';$('roll').hidden=true;$('buy').hidden=!(human&&state.phase==='buy');$('auction').hidden=!(human&&state.phase==='buy');$('end').hidden=true;$('build').disabled=!human||!['roll','end'].includes(state.phase);$('mortgage').disabled=!human||!['roll','end','buy','debt'].includes(state.phase);$('log').replaceChildren();state.log.slice(0,5).forEach(x=>{let p=document.createElement('p');p.textContent=historyLabel(x);$('log').append(p)});if(human&&state.phase==='buy')promptPurchase();else{purchasePromptPending=false;if($('purchasePanel').open)$('purchasePanel').close()}save();scheduleTurnAdvance()}
function scheduleTurnAdvance(){clearTimeout(turnAdvanceTimer);if(!state||state.current!==0||state.phase!=='end'||state.winner!==null||busy||purchasePromptPending||debtPromptPending||state.pendingDebt)return;turnAdvanceTimer=setTimeout(()=>{if(state&&state.current===0&&state.phase==='end'&&!state.pendingDebt&&!purchasePromptPending&&!debtPromptPending&&!$('modal').open)next();else if(state&&state.current===0&&state.phase==='end'&&!state.pendingDebt)scheduleTurnAdvance()},4000)}
function mortgageOptions(){return props.map((p,i)=>({p,i})).filter(x=>x.p.owner===0&&(x.p.mortgaged?player().money>=Math.ceil(x.p.price*.55):x.p.houses===0&&(x.p.group<0||groupIndices[x.p.group].every(i=>props[i].houses===0))))}
async function manageMortgages(required=false){clearTimeout(turnAdvanceTimer);if(!state||state.current!==0||state.winner!==null)return;while(true){const debt=Math.max(0,-player().money);const opts=mortgageOptions();if(required&&debt===0){const creditor=state.pendingDebt?.to??-1,amount=state.pendingDebt?.amount??0;if(creditor>=0&&!state.players[creditor].dead)state.players[creditor].money+=amount;state.pendingDebt=null;state.phase='end';note('Η οφειλή καλύφθηκε.');render();scheduleTurnAdvance();return}if(!opts.length){if(required&&debt>0){const to=state.pendingDebt?.to??-1,amount=state.pendingDebt?.amount??0;const paid=Math.max(0,amount+player().money);if(to>=0&&!state.players[to].dead)state.players[to].money+=paid;state.pendingDebt=null;bankrupt(0,to);if(state.winner===null){advanceAfterHumanBankruptcy()}else{state.phase='finished';render()}}else await modal('🏦 Υποθήκες','Δεν υπάρχουν διαθέσιμα ακίνητα για υποθήκη ή εξόφληση.',[['Κλείσιμο',-1]]);return}const actions=opts.map(x=>[(x.p.mortgaged?'↩ Εξόφληση ':'🏦 Υποθήκη ')+x.p.name+' · '+(x.p.mortgaged?'-'+Math.ceil(x.p.price*.55):'+'+Math.floor(x.p.price/2))+' €',x.i]);actions.push([required?'Αδυναμία πληρωμής':'Κλείσιμο',-1]);const choice=await modal(required?'⚠ Χρειάζονται '+debt+' €':'🏦 Διαχείριση ακινήτων','Διαθέσιμα: '+player().money+' €'+(required?'\nΓια να καλύψεις την οφειλή, επίλεξε ακίνητα.':'\nΕπίλεξε ακίνητο για υποθήκη ή εξόφληση.'),actions);if(choice<0){if(required&&player().money<0){const ok=await modal('⚠ Ανεξόφλητη οφειλή','Χρειάζεσαι '+(-player().money)+' €. Αν συνεχίσεις χωρίς να πληρώσεις, θα χρεοκοπήσεις.',[['Επιστροφή στις υποθήκες',false],['Χρεοκοπία',true]]);if(!ok)continue;const to=state.pendingDebt?.to??-1,amount=state.pendingDebt?.amount??0;const paid=Math.max(0,amount+player().money);if(to>=0&&!state.players[to].dead)state.players[to].money+=paid;state.pendingDebt=null;bankrupt(0,to);if(state.winner===null){advanceAfterHumanBankruptcy()}else{state.phase='finished';render()}}return}const p=props[choice];if(p.owner!==0)continue;if(p.mortgaged){const cost=Math.ceil(p.price*.55);if(player().money<cost)continue;player().money-=cost;p.mortgaged=false;note('Εξόφλησες '+p.name+' με '+cost+' €')}else{if(p.houses>0||(p.group>=0&&!groupIndices[p.group].every(i=>props[i].houses===0)))continue;const gain=Math.floor(p.price/2);p.mortgaged=true;player().money+=gain;note('Υποθήκευσες '+p.name+' και πήρες '+gain+' €')}render();if(!required)continue}}
function advanceAfterHumanBankruptcy(){state.phase='roll';state.current=state.players.findIndex((p,i)=>i>0&&!p.dead);if(state.current<0){state.winner=0;state.phase='finished';render();return}render();aiTurn()}
function scheduleDebtPrompt(){if(!state||state.current!==0||!state.pendingDebt||debtPromptPending)return;debtPromptPending=true;const generation=gameGeneration;setTimeout(async()=>{try{if(generation===gameGeneration&&state?.pendingDebt&&state.current===0)await manageMortgages(true)}finally{if(generation===gameGeneration){debtPromptPending=false;if(state?.phase==='end'&&!state.pendingDebt)scheduleTurnAdvance()}}},350)}
function modal(title,body,actions){return new Promise(resolve=>{modalResolver=resolve;$('modal').dataset.newGame=title==='Νέο παιχνίδι'?'true':'false';$('modal').dataset.settings=title.includes('Ρυθμίσεις')?'true':'false';$('modalTitle').textContent=title;$('modalBody').replaceChildren();let p=document.createElement('p');p.textContent=body;p.style.whiteSpace='pre-line';$('modalBody').append(p);$('dialogActions').replaceChildren();actions.forEach(([label,value])=>{let btn=document.createElement('button');btn.textContent=label;btn.onclick=()=>{$('modal').close();modalResolver=null;resolve(value)};$('dialogActions').append(btn)});$('modal').showModal()})}
$('modal').addEventListener('cancel',e=>{if(modalResolver){e.preventDefault();$('dialogActions').querySelector('button:last-child')?.click()}});

 $('modal').addEventListener('close',()=>{if(state?.winner===null&&state.current===0&&state.phase==='buy'&&!$('purchasePanel').open)setTimeout(promptPurchase,0)});
function timedNotice(title,body,ms=2000){return new Promise(resolve=>{const d=$('modal');if(d.open)d.close();modalResolver=null;$('modalTitle').textContent=title;$('modalBody').replaceChildren();const p=document.createElement('p');p.textContent=body;p.style.whiteSpace='pre-line';$('modalBody').append(p);$('dialogActions').replaceChildren();d.showModal();setTimeout(()=>{if(d.open)d.close();resolve()},ms)})}
function info(i){const p=props[i];modal('🔎 '+p.name,'Θέση '+(i+1)+' / 40\nΤιμή αγοράς: '+(p.price?p.price+' €':'Δεν πωλείται')+'\nΙδιοκτήτης: '+(p.owner<0?'Τράπεζα':state.players[p.owner].name)+'\nΕνοίκιο: '+rent(i)+' €\nΚτίρια: '+p.houses+(p.mortgaged?'\nΣε υποθήκη':'')+'\nΠιόνια εδώ: '+(state.players.filter(x=>!x.dead&&x.pos===i).map(x=>x.name).join(', ')||'Κανένα'),[['Κλείσιμο',true]])}
function card(i){const community=[['Κέρδισες βραβείο!',100],['Έξοδα επισκευής',-80],['Επιστροφή φόρου',60],['Δωρεά στην κοινότητα',-40]];const chance=[['Τυχερή επένδυση!',150],['Πρόστιμο στάθμευσης',-50],['Κέρδη από πωλήσεις',90],['Έκτακτη χρέωση',-100]];let pool=i===7||i===22||i===36?chance:community;let [t,m]=pool[Math.floor(Math.random()*pool.length)];if(m>=0)player().money+=m;else pay(state.current,-1,-m);note('🃏 '+player().name+': '+t+' '+(m>=0?'+':'')+m+'€');if(state.current===0)setTimeout(()=>timedNotice(i===7||i===22||i===36?'🍀 Τυχερή Κάρτα':'🎴 Κάρτα Κοινότητας',t+'\n'+(m>=0?'Κερδίζεις ':'Πληρώνεις ')+Math.abs(m)+' €',2200),180)}
function land(dice){const p=player(),i=p.pos,prop=props[i];if(i===30){p.pos=10;p.jail=3;state.doubles=0;state.extraRoll=false;note(p.name+' πήγε φυλακή');return}if([2,7,17,22,33,36].includes(i)){card(i);return}if(i===4||i===38){pay(state.current,-1,i===4?200:100);note(p.name+' πλήρωσε '+(i===4?200:100)+'€ φόρο στην τράπεζα');return}if(!prop.price)return;if(prop.owner===-1){if(state.current===0){state.phase='buy';note('Διαθέσιμο: '+prop.name+' ('+prop.price+'€)')}else{if(p.money>=prop.price+(state.difficulty==='hard'?120:200)&&Math.random()<(state.difficulty==='easy'?.65:.93)){buy(i)}else auction(i)}return}if(prop.owner!==state.current&&!prop.mortgaged){const amount=rent(i,dice);pay(state.current,prop.owner,amount);note(p.name+' πλήρωσε '+amount+'€ στον '+state.players[prop.owner].name)}}
function buy(i){const p=props[i],buyer=player();if(p.owner!==-1||buyer.money<p.price)return false;buyer.money-=p.price;p.owner=state.current;note(buyer.name+' αγόρασε '+p.name+' για '+p.price+'€');return true}
function auction(i){const prop=props[i],candidates=state.players.map((p,j)=>({p,j,bid:Math.min(Math.floor(p.money*.75),Math.round(prop.price*(.65+Math.random()*.5)))})).filter(x=>x.j!==0&&!x.p.dead&&x.p.money>=x.bid&&x.bid>=Math.round(prop.price*.5));candidates.sort((a,b)=>b.bid-a.bid);if(candidates.length){let win=candidates[0];win.p.money-=win.bid;prop.owner=win.j;note('🔨 '+win.p.name+' κέρδισε '+prop.name+' με '+win.bid+'€');return {winner:win.p.name,bid:win.bid,bids:candidates}}note('🔨 Το '+prop.name+' έμεινε στην τράπεζα');return {winner:null,bid:0,bids:candidates}}
function move(steps){const p=player(),old=p.pos;p.pos=(old+steps)%40;if(p.pos<old){p.money+=200;note(p.name+' πέρασε από Αφετηρία: +200€')}}
function roll(){if(state.phase!=='roll'||state.winner!==null)return;const p=player(),a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);state.dice=[a,b];const doubles=a===b;note(p.name+' έφερε '+a+' + '+b);let releasedFromJail=false;if(p.jail){if(doubles){p.jail=0;releasedFromJail=true;state.doubles=0;note(p.name+' βγήκε από τη φυλακή')}else{p.jail--;if(!p.jail){pay(state.current,-1,50);releasedFromJail=true;state.doubles=0;note(p.name+' πλήρωσε 50€ για έξοδο');if(state.pendingDebt){state.phase='debt';render();scheduleDebtPrompt();return}}else{state.phase='end';render();return}}}else{state.doubles=doubles?state.doubles+1:0;if(state.doubles===3){p.pos=10;p.jail=3;state.doubles=0;state.extraRoll=false;state.phase='end';note('Τρεις διπλές ζαριές: φυλακή');render();return}}move(a+b);land(a+b);if(state.pendingDebt)state.phase='debt';else if(state.phase!=='buy')state.phase='end';state.extraRoll=!!(doubles&&!releasedFromJail&&!p.jail&&!p.dead&&state.phase==='buy');if(doubles&&!releasedFromJail&&!p.jail&&!p.dead&&state.phase==='end'){state.phase='roll';note('Διπλή ζαριά: ξαναπαίζεις')}render();if(state.current===0&&state.pendingDebt)scheduleDebtPrompt();else if(state.current===0&&state.phase==='buy')setTimeout(promptPurchase,350);else if(state.current===0&&state.phase==='roll')scheduleAutoRoll()}
function promptPurchase(){
 if(!state||state.current!==0||state.phase!=='buy'||state.winner!==null)return;
 const i=player().pos,p=props[i];if(!p.price||p.owner!==-1)return;
 purchasePromptPending=true;
 clearTimeout(turnAdvanceTimer);
 $('purchaseTitle').textContent='🏠 '+p.name;
 $('purchaseDetails').textContent='Τιμή '+p.price+'€ · Διαθέσιμα '+player().money+'€';
 $('inlineBuy').disabled=player().money<p.price;
 $('inlineBuy').onclick=()=>finishPurchase(i,1);
 $('inlineAuction').onclick=()=>finishPurchase(i,2);
 // Keep the purchase decision above the board, independently of its layout.
 if(!$('purchasePanel').open && !$('modal').open){
   $('purchasePanel').showModal();
   ($('inlineBuy').disabled?$('inlineAuction'):$('inlineBuy')).focus();
 }
}
async function finishPurchase(i,choice){
 if(!state||state.current!==0||state.phase!=='buy'||player().pos!==i||props[i].owner!==-1)return;
 purchasePromptPending=false;if($('purchasePanel').open)$('purchasePanel').close();
 if(choice===1){if(!buy(i)){promptPurchase();return}state.phase=state.extraRoll?'roll':'end';state.extraRoll=false;render();if(state.phase==='roll')scheduleAutoRoll();else scheduleTurnAdvance();return}
 const p=props[i],result=auction(i);state.phase=state.extraRoll?'roll':'end';state.extraRoll=false;render();
 $('auctionResult').textContent=result.winner?'🔨 '+result.winner+' αγόρασε '+p.name+' για '+result.bid+'€':'🔨 '+p.name+': δεν υπήρξαν προσφορές';
 $('auctionResult').hidden=false;
 setTimeout(()=>{$('auctionResult').hidden=true},2400);
 if(state.phase==='roll')scheduleAutoRoll();else scheduleTurnAdvance();
}
function next(){if(state.winner!==null||state.phase!=='end'||state.current!==0||state.pendingDebt||purchasePromptPending||debtPromptPending)return;clearTimeout(turnAdvanceTimer);state.phase='roll';state.doubles=0;state.extraRoll=false;let old=state.current;do{state.current=(state.current+1)%state.players.length}while(state.players[state.current].dead);if(state.current<=old)state.round++;if(checkEndgame())return;render();if(state.current!==0)aiTurn();else scheduleAutoRoll()}
async function aiTurn(){if(busy||state.winner!==null)return;const generation=gameGeneration;busy=true;render();await new Promise(r=>setTimeout(r,500));if(generation!==gameGeneration)return;let guard=0;while(generation===gameGeneration&&state.current!==0&&state.winner===null&&guard++<80){if(state.phase==='roll')roll();if(state.phase==='buy'){auction(player().pos);state.phase=state.extraRoll?'roll':'end';state.extraRoll=false}if(state.phase==='end'){const i=state.current;if(!state.players[i].dead)aiBuild(i);nextAi();}else if(state.phase==='debt'){const i=state.current;autoLiquidate(i);if(state.players[i].money<0)bankrupt(i,-1);state.phase='end';nextAi();}render();await new Promise(r=>setTimeout(r,450))}if(generation!==gameGeneration)return;busy=false;render();if(state.current===0&&state.winner===null)scheduleAutoRoll()}
function scheduleAutoRoll(){if($('modal').open)return;if(autoRollPending||busy||!state||state.current!==0||state.phase!=='roll'||state.winner!==null)return;autoRollPending=true;const generation=gameGeneration;setTimeout(()=>{if(generation!==gameGeneration)return;autoRollPending=false;if(!busy&&state&&state.current===0&&state.phase==='roll'&&state.winner===null){roll();if(state.phase==='roll')scheduleAutoRoll()}},850)}
function nextAi(){if(state.winner!==null)return;const old=state.current;state.phase='roll';state.doubles=0;state.extraRoll=false;let guard=0;do{state.current=(state.current+1)%state.players.length;if(++guard>state.players.length)return}while(state.players[state.current].dead);if(state.current<=old)state.round++;checkEndgame()}
function aiBuild(i){const p=state.players[i];if(p.money<350)return;let opts=props.filter(x=>x.owner===i&&monopoly(x)&&x.houses<5&&!x.mortgaged);if(opts.length){const x=opts.sort((a,b)=>a.houses-b.houses)[0],cost=Math.round(x.price/2);if(p.money>cost+250&&x.houses===Math.min(...groupIndices[x.group].map(k=>props[k].houses))){p.money-=cost;x.houses++;note(p.name+' έχτισε στο '+x.name)}}}
$('roll').onclick=roll;$('buy').onclick=()=>{if(buy(player().pos))state.phase='end';else note('Δεν υπάρχουν αρκετά χρήματα');render()};$('auction').onclick=async()=>{if(state.phase!=='buy'||state.current!==0)return;let i=player().pos,p=props[i];let confirm=await modal('🔨 Δημοπρασία: '+p.name,'Αξία ακινήτου: '+p.price+' €. Αν δεν το αγοράσεις, οι αντίπαλοι AI κάνουν αυτόματες προσφορές. Εσύ δεν χρεώνεσαι και δεν συμμετέχεις στη δημοπρασία.',[['Έναρξη δημοπρασίας',true],['Άκυρο',false]]);if(!confirm)return;let result=auction(i);state.phase='end';render();await timedNotice('🔨 Αποτέλεσμα δημοπρασίας','Ακίνητο: '+p.name+'\n'+(result.bids.length?'Προσφορές AI:\n'+result.bids.map(x=>x.p.name+': '+x.bid+' €').join('\n')+'\n':'Δεν έγιναν προσφορές.\n')+(result.winner?'Νικητής: '+result.winner+' με '+result.bid+' €':'Το ακίνητο παραμένει διαθέσιμο στην τράπεζα.'),2000)};$('end').onclick=next;
$('build').onclick=async()=>{let options=props.map((p,i)=>({p,i})).filter(x=>x.p.owner===0&&monopoly(x.p)&&x.p.houses<5&&!x.p.mortgaged&&player().money>=Math.round(x.p.price/2));if(!options.length){await modal('Χτίσιμο','Χρειάζεσαι πλήρη ομάδα χρώματος και αρκετά χρήματα.',[['Εντάξει',0]]);return}let choice=await modal('Χτίσιμο','Διάλεξε ακίνητο. Κόστος κάθε κτιρίου: μισή τιμή αγοράς.',[...options.map(x=>[x.p.name+' ('+Math.round(x.p.price/2)+'€)',x.i]),['Άκυρο',-1]]);if(choice>=0){let p=props[choice];const siblings=groupIndices[p.group].map(i=>props[i].houses);if(p.houses>Math.min(...siblings)){note('Χτίζεις ομοιόμορφα σε όλη την ομάδα');render();return}player().money-=Math.round(p.price/2);p.houses++;note('Έχτισες στο '+p.name);render()}};
$('mortgage').onclick=async()=>{if(state.current!==0||state.winner!==null)return;await manageMortgages(!!state.pendingDebt)};
async function startNewGameFlow(){
 const n=await modal('Νέο παιχνίδι','Επίλεξε πόσους αντιπάλους θέλεις στην παρτίδα.',[
  ['🤖 1 AI',1],['🤖 2 AI',2],['🤖 3 AI',3],['Ακύρωση',0]
 ]);
 if(!n){if(state?.phase==='roll')scheduleAutoRoll();return false}
 const inProgress=state?.winner===null&&Array.isArray(state.log)&&state.log.some(x=>String(x).includes('έφερε'));
 if(inProgress){
  const ok=await modal('Επιβεβαίωση','Η τρέχουσα παρτίδα θα αντικατασταθεί.',[['Νέα παρτίδα',true],['Άκυρο',false]]);
  if(!ok){if(state?.phase==='roll')scheduleAutoRoll();return false}
 }
 gameGeneration++;
 clearTimeout(turnAdvanceTimer);
 if($('modal').open)$('modal').close();
 state=initial(n);
 busy=false;purchasePromptPending=false;debtPromptPending=false;autoRollPending=false;
 note('Νέα παρτίδα με '+n+' AI');
 render();
 setTimeout(()=>{if(state&&state.winner===null&&state.round===1&&state.current===0&&state.phase==='roll')scheduleAutoRoll()},350);
 return true
}
$('newGame').onclick=()=>startNewGameFlow();
$('settings').onclick=async()=>{
 const c=await modal('⚙ Ρυθμίσεις','Παιχνίδι ακινήτων με πρωτότυπο ταμπλό. Στόχος: να μείνεις ο τελευταίος παίκτης με χρήματα. Ρίχνεις δύο ζάρια, αγοράζεις ελεύθερα ακίνητα, εισπράττεις ενοίκια και χτίζεις αφού αποκτήσεις όλα τα ακίνητα ενός χρώματος. Αν αρνηθείς αγορά γίνεται δημοπρασία. Στην Αφετηρία εισπράττεις 200€. Υπάρχουν φόροι, κάρτες, φυλακή, υποθήκες και χρεοκοπία. Η πρόοδος αποθηκεύεται αυτόματα.',[['Συνέχεια',0],['Νέο παιχνίδι',1]]);
 if(c===1)await startNewGameFlow();
 else if(state?.phase==='roll')scheduleAutoRoll();
}
try{
 const saved=JSON.parse(localStorage.getItem(SAVE)||'null');
 const valid=saved&&Array.isArray(saved.players)&&saved.players.length>=2&&saved.players.length<=4
  &&Array.isArray(saved.properties)&&saved.properties.length===40&&Array.isArray(saved.log)
  &&Array.isArray(saved.dice)&&saved.dice.length===2&&Number.isInteger(saved.current)
  &&saved.current>=0&&saved.current<saved.players.length
  &&Number.isInteger(saved.round)&&saved.round>=1
  &&['roll','buy','end','debt','finished'].includes(saved.phase)
  &&saved.players.every(p=>p&&typeof p.money==='number'&&Number.isInteger(p.pos))
  &&saved.properties.every(p=>p&&Number.isInteger(p.owner)&&Number.isInteger(p.houses));
 state=valid?saved:initial(2);
}catch(_){state=initial(2)}sync();if(state.players?.[0])state.players[0].name='seemsfunny';if(Array.isArray(state.log))state.log=state.log.map(historyLabel);if(state.winner===null&&state.round>MAX_ROUNDS)checkEndgame();if(!state.log.length)note('Καλώς ήρθες! Ρίξε τα ζάρια.');render();if(state.current!==0&&state.winner===null)aiTurn();else if(state.pendingDebt)scheduleDebtPrompt();else if(state.phase==='buy')setTimeout(promptPurchase,450);else if(state.phase==='end')scheduleTurnAdvance();else scheduleAutoRoll();
})();
